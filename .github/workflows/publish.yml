name: Publish

# `publisher` (kino-poi) is registered, but VSCE_PAT is not set up yet as a
# repository secret, so the actual publish step below skips itself gracefully
# (checks still run). Generating that PAT requires an Azure DevOps organization
# linked to an Azure subscription, which free-trial subscriptions don't support
# as of writing — for now, releases (0.1.0 onward) are published manually via
# `npx vsce package` + uploading the resulting .vsix at
# https://marketplace.visualstudio.com/manage. Once VSCE_PAT is added as a
# repository secret, tagging a release (e.g. `git tag v0.1.0 && git push --tags`)
# will publish that build automatically instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - if: ${{ secrets.VSCE_PAT != '' }}
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}
      - if: ${{ secrets.VSCE_PAT == '' }}
        run: echo "VSCE_PAT is not set as a repository secret yet — skipping automated publish. Releases are published manually via 'npx vsce package' + uploading the .vsix at https://marketplace.visualstudio.com/manage instead."
