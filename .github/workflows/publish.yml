name: Publish

# Scaffold only: `publisher` (kino-poi) is registered, but VSCE_PAT is not set up
# yet as a repository secret, so this workflow doesn't run automatically yet.
# Generating that PAT requires an Azure DevOps organization linked to an Azure
# subscription, which free-trial subscriptions don't support as of writing — for
# now, releases are published manually via `npm run package` + uploading the
# resulting .vsix at https://marketplace.visualstudio.com/manage. Once VSCE_PAT
# is added as a repository secret, tagging a release (e.g. `git tag v0.1.0 &&
# git push --tags`) will publish that build automatically instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}
